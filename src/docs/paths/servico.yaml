 # paths/servico.yaml

 paths:
   /service:
     get:
       summary: Listar td os servicos
       desciption: retorna um lista de todos os os sevicos deponíveis
       responses:
         "200":
           description: Lista de servicos
           content:
           application/json:
            schema:
               type: array
               items:
                 $ref: "#/components/schemas/Servico"
         "404":
           description: "nenhum servico encontrado"
           content:
              application/json:
                   schema:
                     type: object
                     $ref: "#/components/schemas/responseError"
                     /service/create:
                       post:
                       summary: criar um novo servico
                       description: cria um novo service
                       requestBody:
                          required: true
                          content:
                             application/json:
                               schema:
                                   type:
                                    properties:
                      
