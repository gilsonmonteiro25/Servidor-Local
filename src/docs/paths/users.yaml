paths:
  /users:
    get:
      summary: Listar todos os usuários
      tags:
        - Usuários
      description: Retorna uma lista de todos os usuários disponíveis
      responses:
        "200":
          description: Lista de usuários
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
        "400":
          description: Nenhum usuário encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseError"
  /users/create:
    post:
      summary: Criar um novo usuário
      tags:
        - Usuários 
      description: Cria um novo usuário
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUser"
      responses:
        "200":
          description: Usuário criado com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseSucess"
        "400":
          description: Dados inválidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseError"

  /users/{id}:
    get:
      summary: Buscar usuário por ID
      tags:
        - Usuários
      description: Retorna um usuário específico pelo ID
      parameters:
        - name: id
          in: path
          required: true
          description: ID do usuário
          schema:
            type: integer
            example: 1
      responses:
        "200":
          description: Usuário encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseSucess"
        "404":
          description: Usuário não encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseError"
  /users/update/{id}:
    put:
      summary: Atualizar usuário
      tags:
        - Usuários
      description: Atualiza um usuário pelo ID
      parameters:
        - name: id
          in: path
          required: true
          description: ID do usuário
          schema:
            type: integer
            example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUser"
      responses:
        "200":
          description: Usuário atualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseSucess"
        "400":
          description: Dados inválidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseError"
        "404":
          description: Usuário não encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseError"

    /users/delete/{id}:
      summary: Apagar usuário
      tags:
        - Usuários
      description: Remove um usuário pelo ID
      parameters:
        - name: id
          in: path
          required: true
          description: ID do usuário
          schema:
            type: integer
            example: 1
      responses:
        "200":
          description: Usuário apagado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseSucess"
        "404":
          description: Usuário não encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseError"

  /users/login: 
    post:
      summary: login de um usuário
      tags:
        - Usuários
      description: Faqzer login de un usuário
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginUser"

      responses:
        "200":
          description: Usuário logado com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseSucess"
        "404":
          description: Usuário não encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseError"
        "400":
          description: "erro ao logar usuário"
          content:
            application/json:
              schema:
                type: object
                $ref: "#/components/schemas/ResponseError"