#schema/servico.yaml

   # id: string,
   # nome: string,
   # descricao: string,
   # categoria: string,
   # enabled: boolean,
   # created_at: string,
   # updated_at: string

components:
  schemas:
  # schema principal de servico
    servico:
      type: object
      properties:
        id:
           type: integer
           example: 1
        nome:
          type: string
          example: "servico de limpeza"
        descricao:
          type: string
          exemple: "servico de limpeza proficional para residências e..."
        categoria:
          type: string
          example: "limpeza"
        enabled:
          type: boolean
          example: true
        created_at:
           type: string
           example: "2022-01-01T00:00:00.000Z"
        updated_at:
           type: string
           example:  "2022-01-01T00:00:00.000Z"


    # schema para criar um novo servico
    createService:
      type: object
      properties:
      nome:
        type: string
        example: "serviço de Limpeza"
      descricao:
        type: string
        example:
      categoria:
        type: string
        example: limpeza
      enabled: 
        type: boolean
        example: true
     
    # schema generico para sucesso
    responseSucess:
      type:
      properties:
      message:
        type: string
        example: "serviço criado com sucesso"
      status  :
        type: boolean
        example: true
      data:
        type: object
        $ref: "#/components/schemas/servico"


    # schema genarico de rsposta de erro
    responseError:
      type: object
      properties:
        massage:
          type: string
          example: "erro ao buscar servicos"
        data:
          type: object
          properties:
            null