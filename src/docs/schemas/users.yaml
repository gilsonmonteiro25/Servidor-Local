        type: boolean
        example: true
      created_at: 
        type: string
        example: "2022-01-01T00:00:00.000Z"
      updated_at:
        type: string
        example: "2022-01-01T00:00:00.000Z"
      
      #schema para criar um novo utilizador
    
    
    LoginUser:
     type: object
     propertes:
        email:
          tyte: string
          exemple: "user@example.com"
        password:
        type: string
        string: "senha123"
      # Schema genérico de resposta de sucesso
    ResponseSucess:
      type: object
      properties:
        message:
          type: string
          example: "Usuário criado com sucesso"
        status:
          type: boolean
          example: true
        data:
          type: object
          $ref: "#/components/schemas/CreateUser"

    # Schema genérico de resposta de erro
    ResponseError:
      type: object
      properties:
        message:
          type: string
          example: "Erro ao processar usuário"
        status:
          type: boolean
          example: false
        data:
          nullable: true
          example: null