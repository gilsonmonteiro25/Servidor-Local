  components:
    schemas:
      type: object
      properties:
      id:
        type: varchar
        example: 1
      nome:
        type: string
        example: Gilson Monteiro
      numero_identificação:
        type: number
        example: M001S
      data_nascimento:
        type: date
        example: 26-11-1999
      email:
        type: string
        example: gilsonpatasmonteiro@gmail.com
      telefone:
        type: number
        example: 5872820
      pais:
        type: string
        example: Cabo Verde
      localidade:
        type: string
